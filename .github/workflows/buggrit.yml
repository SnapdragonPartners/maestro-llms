name: buggrit

# Automated PR review by buggrit (https://github.com/SnapdragonPartners/buggrit),
# piloted here alongside Copilot. It posts each finding as its own review
# thread and re-verifies earlier findings on every push and reply. The job
# itself lives in buggrit's reusable workflow, at the newest v0 release.
#
# buggrit reads .github/buggrit.json from the PR's base branch, never from
# the PR, and runs no PR code. The triggers and the concurrency group have to
# be here, in the calling workflow (buggrit design §3, "Bot events").
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  # buggrit's own comments get a throwaway group, so they never replace a run
  # queued by a human reply. The login must match identity.bot_login.
  group: >-
    ${{ (github.event.comment.user.login == (vars.BUGGRIT_BOT_LOGIN || 'buggrit-bot[bot]') ||
         github.event.review.user.login == (vars.BUGGRIT_BOT_LOGIN || 'buggrit-bot[bot]'))
        && format('buggrit-ignored-{0}', github.run_id)
        || format('buggrit-{0}', github.event.pull_request.number || inputs.pr) }}
  # A push cancels the pass in flight; reply-triggered runs wait their turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  buggrit:
    uses: SnapdragonPartners/buggrit/.github/workflows/review.yml@v0
    secrets: inherit
