name: Integration (live providers)

# Manual only — never auto-runs. Trigger from the Actions tab.
# Exercises the //go:build integration tests against the REAL provider APIs
# (Anthropic, OpenAI chat+embeddings, Google) plus a local Ollama started in
# the runner. Each provider test skips if its key/host is absent, so a missing
# secret degrades to a skip rather than a failure.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      # actions/* are first-party, pinned by major tag (same posture as ci.yml).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Models go under $HOME so actions/cache can actually read/write them.
      # The official installer otherwise runs Ollama as a systemd service
      # storing models in /usr/share/ollama/.ollama/models (root-owned), which
      # the cache action can't use — the cache key would never hit.
      - name: Configure Ollama model dir
        run: echo "OLLAMA_MODELS=$HOME/.ollama/models" >> "$GITHUB_ENV"

      # Official Ollama install script (curl|sh). Acceptable here: this
      # workflow is manual-only and not a release/build path.
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          # llama3.2:1b is a non-reasoning instruct model: deterministic and
          # fast for CI. (qwen3:0.6b is a reasoning model — its always-on
          # <think> phase returns empty content under small token budgets and
          # is unbounded otherwise; unsuitable for a fast deterministic gate.)
          key: ollama-models-llama3.2-1b

      - name: Start Ollama and pull model
        run: |
          # Don't use the installer's systemd service; run our own server so
          # it uses $OLLAMA_MODELS (the cached path) rather than the
          # root-owned service store.
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          ollama serve &
          # Poll readiness instead of a fixed sleep, so `pull` can't race
          # an unready server.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b   # ~1.3GB, CPU-fast; cached after first run

      # Secrets (masked), not Variables. The provider tests read these env
      # names; the Google test accepts GOOGLE_GENAI_API_KEY. OLLAMA_MODEL
      # overrides the local default so CI uses the small cached model.
      - name: Run live integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          OLLAMA_HOST: http://localhost:11434
          OLLAMA_MODEL: llama3.2:1b
        run: make test-integration
