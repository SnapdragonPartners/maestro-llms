# Go linting configuration for maestro-llms.
# Adapted from the Maestro orchestrator config; product-specific exclusions
# removed and a depguard rule added to enforce the core/provider boundary.
run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  enable:
    # Core formatting and imports
    - gofmt
    - goimports
    - gci

    # Essential checks
    - govet
    - typecheck
    - staticcheck
    - unused
    - ineffassign
    - misspell

    # Error handling
    - errcheck
    - errorlint
    - wrapcheck

    # Code quality and maintainability
    - gosimple
    - goconst
    - unconvert
    - unparam
    - revive
    - cyclop
    - dupl
    - maintidx

    # Security
    - gosec
    - bodyclose
    - noctx

    # Nil safety
    - nilerr
    - nilnesserr
    - nilnil
    - forcetypeassert

    # Performance and resource management
    - makezero
    - prealloc
    - containedctx
    - contextcheck

    # Best practices
    - copyloopvar
    - gocritic
    - gochecknoinits
    - gochecknoglobals
    - gomodguard
    - depguard

    # Style and consistency
    - stylecheck
    - whitespace
    - dogsled
    - nakedret
    - predeclared

    # Documentation
    - godot

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/SnapdragonPartners/maestro-llms)
    skip-generated: true

  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: true
    match-constant: true
    numbers: false
    ignore-calls: true

  govet:
    enable:
      - shadow
      - nilness
      - unusedwrite
      - fieldalignment
      - sortslice

  staticcheck:
    checks: ["all"]

  gosec:
    severity: medium
    confidence: medium
    config:
      G302: "0644"
      G306: "0644"

  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: true

  maintidx:
    under: 20

  dupl:
    threshold: 100

  revive:
    severity: warning
    rules:
      - name: exported
        severity: error
        disabled: false
      - name: unexported-return
        severity: warning
        disabled: false
      - name: unused-parameter
        severity: warning
        disabled: false
      - name: unreachable-code
        severity: error
        disabled: false
      - name: redefines-builtin-id
        severity: error
        disabled: false
      - name: superfluous-else
        severity: warning
        disabled: false
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - ["ID", "HTTP", "JSON", "API", "URI", "URL", "LLM", "AI", "OS", "TTL"]

  contextcheck:
    check-generated: false

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
    ignoreSigRegexps:
      - \.New.*Error\(
    ignorePackageGlobs:
      # apierr.Classify returns the canonical *llms.ProviderError that
      # providers must return verbatim; wrapping it would break
      # errors.As(*llms.ProviderError) for callers.
      - github.com/SnapdragonPartners/maestro-llms/llms/providers/internal/apierr

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

  dogsled:
    max-blank-identifiers: 3

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
      - importShadow
      - unnamedResult
      # hugeParam conflicts structurally with the spec: ChatClient /
      # EmbeddingClient pass ChatRequest/EmbeddingRequest by value
      # (deliberate value semantics), so every provider, fake, and
      # middleware method would trip it. Encoded once here rather than
      # scattering nolints across every implementation.
      - hugeParam
    settings:
      captLocal:
        paramsOnly: true
      rangeValCopy:
        sizeThreshold: 32

  gomodguard:
    blocked:
      modules:
        - github.com/pkg/errors:
            recommendations:
              - errors
              - fmt
            reason: "Use standard library errors and fmt.Errorf instead"
      local_replace_directives: false

  # Enforce the spec's load-bearing boundary: the core llms package and the
  # middleware/ratelimit packages must not import provider packages. Providers
  # are leaf imports pulled in only by applications that need them.
  depguard:
    rules:
      core-no-providers:
        files:
          - "**/llms/*.go"
          - "**/llms/middleware/**"
          - "**/llms/ratelimit/**"
          - "**/llms/testllm/**"
        deny:
          - pkg: "github.com/SnapdragonPartners/maestro-llms/llms/providers"
            desc: "core/middleware/ratelimit must not import provider packages; providers are leaf imports"

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

  exclude:
    - "should not use dot imports"

  exclude-rules:
    # Test files - be more lenient
    - path: "_test\\.go"
      linters:
        - errcheck
        - goconst
        - gocritic
        - cyclop
        - maintidx
        - dupl
        - gochecknoglobals
        - gochecknoinits
        - gosec
        - wrapcheck
        - prealloc
        - depguard

    # Example test files
    - path: "example_test\\.go"
      linters:
        - errcheck
        - govet
        - gosec
        - unparam

    # fieldalignment prioritizes GC-scan/memory layout over readability.
    # The core llms package is the public API surface: spec-faithful,
    # readable field order outweighs the micro-optimization there. Provider,
    # middleware, ratelimit, and testllm packages keep fieldalignment.
    - linters:
        - govet
      text: "fieldalignment:"
      path: "llms/[^/]+\\.go$"

    # fieldalignment prioritizes memory over readability; skip in tests
    - linters:
        - govet
      text: "fieldalignment:"
      path: "_test\\.go"

    # Deprecated-symbol usage is sometimes required for provider compatibility
    - linters:
        - staticcheck
      text: "SA1019:"

    - linters:
        - gocritic
      text: "commentedOutCode:"

    - linters:
        - godox
      text: "TODO:"

  exclude-dirs:
    - .git

  exclude-files:
    - ".*\\.pb\\.go$"
