name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Pinned tool versions. Bumping these is intentional and is part of
# the "what version analyzed this code" audit trail. GOVULNCHECK_VERSION
# must be kept in sync by hand with scheduled-security.yml (GitHub
# Actions has no native cross-workflow env share).
env:
  GOLANGCI_VERSION: v1.64.8
  GOVULNCHECK_VERSION: v1.1.4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    # Postgres for the bucket/postgres tests (ADR-0025). They skip when
    # BUCKET_POSTGRES_DSN is unset; here it points at this container, and
    # each run creates and drops its own databases.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bucket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # actions/* are first-party GitHub-owned, pinned by major tag.
      # Linting and govulncheck are installed via `go install @<pinned
      # version>` (immutable module versions, no third-party action)
      # and compiled with this job's Go toolchain — building
      # golangci-lint with an older Go than go.mod targets makes it
      # refuse to run, which is why the prebuilt action binary is not
      # used here.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tool binaries
        id: cache-go-tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-vuln-${{ env.GOVULNCHECK_VERSION }}

      - name: Install Go tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Lint
        run: golangci-lint run

      - name: Build
        run: go build ./...

      - name: Vulnerability check
        run: govulncheck ./...

      # Each example is its own module with a `replace` onto the root, so
      # root dependency bumps can silently break it (e.g. a raised `go`
      # directive). `go mod tidy -diff` fails if the example's go.mod/go.sum
      # drifted from what the root now requires.
      - name: Build examples
        run: |
          set -euo pipefail
          for mod in examples/*/go.mod; do
            dir="$(dirname "$mod")"
            echo "==> $dir"
            (cd "$dir" && go mod tidy -diff) || { echo "::error::$dir is out of sync with the root module; run 'make tidy' and commit"; exit 1; }
            (cd "$dir" && go build ./... && govulncheck ./...)
          done

      - name: Test
        env:
          BUCKET_POSTGRES_DSN: postgres://postgres:bucket@localhost:5432/postgres?sslmode=disable
          BUCKET_POSTGRES_REQUIRED: "1"
        run: go test -cover ./...
